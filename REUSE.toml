version = 1
SPDX-PackageName = "HaslamPCB"
SPDX-PackageDownloadLocation = "https://github.com/magnetic-trowel/HaslamPCB"

# When several tables match a file, the last matching table wins.

# Default: code and anything else not matched below is GPL-3.0-or-later.
# Files with their own SPDX header keep it ("closest").
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 HaslamPCB contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Benchmark results, board manifests and board-id suites we generate are CDLA-Permissive-2.0.
[[annotations]]
path = ["tools/research/**/results/*.jsonl", "bench/manifests/*.jsonl", "bench/suites/**", "tools/research/board-sourcing/found/*.jsonl", "tools/research/board-sourcing/*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 HaslamPCB contributors"
SPDX-License-Identifier = "CDLA-Permissive-2.0"

# A footprint copied from the official KiCad library (kicad-footprint-generator output).
[[annotations]]
path = "tools/research/llm-design/designs/liion-balancer/footprints/custom.pretty/PhoenixContact_*.kicad_mod"
precedence = "override"
SPDX-FileCopyrightText = "KiCad Library Team and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"

# A footprint derived from the official KiCad library (exposed pad removed).
[[annotations]]
path = "tools/research/llm-design/designs/solar-small/footprints/custom.pretty/LTC_DDB10_NoEP.kicad_mod"
precedence = "override"
SPDX-FileCopyrightText = "KiCad Library Team and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"

# Schematics and project symbol libraries generated by haslamsynth embed KiCad library symbols
# (lib_symbols); only the small synth/examples/usb-led output is committed.
[[annotations]]
path = ["tools/research/llm-design/**/out/**.kicad_sch", "tools/research/llm-design/**/out/**.kicad_sym"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 HaslamPCB contributors", "KiCad Library Team and contributors"]
SPDX-License-Identifier = "GPL-3.0-or-later AND CC-BY-SA-4.0 WITH KiCad-libraries-exception"

# Documentation, research notes, and reports are CC-BY-4.0.
[[annotations]]
path = ["**/*.md", "research_notes/**", "reports/**", "docs/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 HaslamPCB contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The PCBWorld D3 suites are derived from LGAI-Research/PCBWorld
# configs/datasets/d3.json @ 1989a93, which is BSD-3-Clause. Keep this table
# after the CDLA one so it wins for these three files.
[[annotations]]
path = ["bench/suites/pcbworld-d3a-test.txt", "bench/suites/pcbworld-d3b-test.txt", "bench/suites/pcbworld-d3c-test.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2026, LG Management Development Institute Co., Ltd. (LG AI Research)", "2026 HaslamPCB contributors"]
SPDX-License-Identifier = "BSD-3-Clause"

# A footprint derived from the official KiCad library (exposed pad enlarged to the LTC FE20 drawing).
[[annotations]]
path = "tools/research/llm-design/designs/obd-solar/footprints/custom.pretty/LTC_FE20_EP2.74x4.95.kicad_mod"
precedence = "override"
SPDX-FileCopyrightText = "KiCad Library Team and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"

# obd-solar handoff package: this project's own design files (boards, project, rules, intent, evaluations), generated
# on branch obd-solar-e2e; the custom footprint they use carries its own annotation above.
[[annotations]]
path = "tools/research/llm-design/designs/obd-solar/handoff/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 HaslamPCB contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# JLC CPL rotation corrections, verbatim from bennymeg/Fabrication-Toolkit plugins/transformations.csv (Apache-2.0).
[[annotations]]
path = "tools/research/llm-design/synth/src/haslamsynth/fab/jlc_cpl_rotations.csv"
precedence = "override"
SPDX-FileCopyrightText = "Benny Megidish and Fabrication-Toolkit contributors"
SPDX-License-Identifier = "Apache-2.0"
