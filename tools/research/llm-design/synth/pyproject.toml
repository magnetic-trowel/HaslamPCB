[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haslamsynth"
version = "0.1.0"
description = "Design synthesis: typed circuit IR to checked KiCad schematics and placement intent"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
# `haslamsynth fp-fetch` (EasyEDA land patterns); easyeda2kicad is AGPL-3.0, imported as a separate library
parts = ["easyeda2kicad>=1.0"]

[project.scripts]
haslamsynth = "haslamsynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kicad: needs KiCad 10 (kicad-cli and the official symbol/footprint libraries)"]

[tool.setuptools.package-data]
haslamsynth = ["fab/*.json"]
